services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-telekt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telekt-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-telekt}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-telekt} -d ${POSTGRES_DB:-telekt}"]
      interval: 5s
      timeout: 3s
      retries: 20

  temporal:
    image: temporalio/auto-setup:1.29.1
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-telekt}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-telekt-local-only}
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "${TEMPORAL_PORT:-7233}:7233"
    volumes:
      - ./infra/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    depends_on:
      postgres:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:2.34.0
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:${PORT:-8421}
    ports:
      - "${TEMPORAL_UI_PORT:-8080}:8080"
    depends_on:
      - temporal

  app:
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-telekt}:${POSTGRES_PASSWORD:-telekt-local-only}@postgres:5432/${POSTGRES_DB:-telekt}
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started

  worker:
    command: ["digital-company-temporal-worker"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-telekt}:${POSTGRES_PASSWORD:-telekt-local-only}@postgres:5432/${POSTGRES_DB:-telekt}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started

volumes:
  postgres_data:
