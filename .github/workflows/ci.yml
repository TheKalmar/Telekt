name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and quality tools
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests scripts evals

      - name: Verify formatting
        run: ruff format --check src tests scripts evals

      - name: Test with branch coverage
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Validate behavior-eval fixtures
        run: python evals/run_local.py --validate-only

      - name: Scan source for medium and high-severity security findings
        run: bandit -r src -q -ll

      - name: Audit installed dependencies
        run: pip-audit --skip-editable

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error

  compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate the default durable stack
        run: docker compose -f compose.yaml -f compose.infrastructure.yaml config --quiet
      - name: Validate optional overlays
        run: |
          docker compose -f compose.yaml -f compose.infrastructure.yaml -f compose.local.yaml config --quiet
          docker compose -f compose.yaml -f compose.infrastructure.yaml -f compose.email.yaml config --quiet
