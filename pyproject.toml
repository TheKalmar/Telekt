[project]
name = "telekt-ai-company"
version = "0.1.0"
description = "A governed control plane for durable, autonomous digital companies"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Marko Kalajdzic" }]
requires-python = ">=3.11"
keywords = ["ai-agents", "temporal", "fastapi", "postgresql", "governance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "openai-agents[litellm]>=0.8.0",
  "litellm>=1.84.0,<2",
  "pydantic>=2.10",
  "python-dotenv>=1.0",
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "python-multipart>=0.0.20",
  "temporalio>=1.30,<2",
  "psycopg[binary,pool]>=3.3,<4",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.8,<2",
  "httpx2>=2.12,<3",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]
browser = ["playwright>=1.54"]

[project.urls]
Homepage = "https://github.com/TheKalmar/Telekt"
Documentation = "https://github.com/TheKalmar/Telekt/tree/main/docs"
Issues = "https://github.com/TheKalmar/Telekt/issues"

[project.scripts]
digital-company = "digital_company.cli:main"
digital-company-web = "digital_company.web:main"
digital-company-worker = "digital_company.worker:main"
digital-company-browser = "digital_company.browser_runtime:main"
digital-company-execution-runtime = "digital_company.execution_runtime:main"
digital-company-temporal-worker = "digital_company.temporal_worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/digital_company"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["digital_company"]
omit = [
  "src/digital_company/browser_runtime.py",
  "src/digital_company/worker.py",
  "src/digital_company/temporal_worker.py",
]

[tool.coverage.report]
fail_under = 65
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".company", ".backups"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "PIE", "RUF"]

[tool.ruff.lint.per-file-ignores]
"evals/run_local.py" = ["E402"]
"tests/**/*.py" = ["S101"]
