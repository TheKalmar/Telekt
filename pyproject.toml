[project]
name = "digital-ai-company-poc"
version = "0.1.0"
description = "Autonomous digital company proof of concept"
requires-python = ">=3.11"
dependencies = [
  "openai-agents>=0.8.0",
  "pydantic>=2.10",
  "python-dotenv>=1.0",
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
digital-company = "digital_company.cli:main"
digital-company-web = "digital_company.web:main"
digital-company-worker = "digital_company.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/digital_company"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
