name: digital-company

services:
  app:
    build:
      context: .
    ports:
      - "${PORT:-8421}:8421"
    environment:
      HOST: 0.0.0.0
      PORT: 8421
      COMPANY_DATA_DIR: /data
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      LOCAL_MODEL: ${LOCAL_MODEL:-deepseek-company:8b}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-120}
      MODEL_TRANSIENT_RETRIES: ${MODEL_TRANSIENT_RETRIES:-2}
      STRUCTURED_OUTPUT_RETRIES: ${STRUCTURED_OUTPUT_RETRIES:-1}
      AGENT_MAX_TURNS: ${AGENT_MAX_TURNS:-8}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      APPROVAL_SIGNING_SECRET: ${APPROVAL_SIGNING_SECRET:-}
      APPROVAL_LINK_TTL_HOURS: ${APPROVAL_LINK_TTL_HOURS:-72}
    volumes:
      - company_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  worker:
    build:
      context: .
    command: ["digital-company-worker"]
    environment:
      COMPANY_DATA_DIR: /data
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      WORKER_ID: worker-1
      WORKER_POLL_SECONDS: 2
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-120}
      MODEL_TRANSIENT_RETRIES: ${MODEL_TRANSIENT_RETRIES:-2}
      STRUCTURED_OUTPUT_RETRIES: ${STRUCTURED_OUTPUT_RETRIES:-1}
      AGENT_MAX_TURNS: ${AGENT_MAX_TURNS:-8}
      APPROVAL_SIGNING_SECRET: ${APPROVAL_SIGNING_SECRET:-}
      APPROVAL_LINK_TTL_HOURS: ${APPROVAL_LINK_TTL_HOURS:-72}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-true}
    volumes:
      - company_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped

volumes:
  company_data:
