name: digital-company

services:
  app:
    build:
      context: .
    ports:
      - "${PORT:-8421}:8421"
    environment:
      HOST: 0.0.0.0
      PORT: 8421
      COMPANY_DATA_DIR: /data
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      LOCAL_MODEL: ${LOCAL_MODEL:-deepseek-company:8b}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-240}
      LOCAL_THINKING: ${LOCAL_THINKING:-false}
      LOCAL_MAX_OUTPUT_TOKENS: ${LOCAL_MAX_OUTPUT_TOKENS:-768}
      MODEL_TRANSIENT_RETRIES: ${MODEL_TRANSIENT_RETRIES:-2}
      STRUCTURED_OUTPUT_RETRIES: ${STRUCTURED_OUTPUT_RETRIES:-1}
      AGENT_MAX_TURNS: ${AGENT_MAX_TURNS:-8}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      COMPUTER_USE_MODEL: ${COMPUTER_USE_MODEL:-gpt-5.6}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      APPROVAL_SIGNING_SECRET: ${APPROVAL_SIGNING_SECRET:-}
      APPROVAL_LINK_TTL_HOURS: ${APPROVAL_LINK_TTL_HOURS:-72}
      SHOPIFY_CLIENT_ID: ${SHOPIFY_CLIENT_ID:-}
      SHOPIFY_CLIENT_SECRET: ${SHOPIFY_CLIENT_SECRET:-}
      BROWSER_RUNTIME_URL: http://browser-runtime:8430
    volumes:
      - company_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - browser-runtime
    restart: unless-stopped

  browser-runtime:
    build:
      context: .
      dockerfile: Dockerfile.browser
    environment:
      HOST: 0.0.0.0
      PORT: 8430
      BROWSER_DATA_DIR: /browser-data
    volumes:
      - browser_data:/browser-data
    shm_size: "1gb"
    restart: unless-stopped

  worker:
    build:
      context: .
    command: ["digital-company-worker"]
    environment:
      COMPANY_DATA_DIR: /data
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      WORKER_ID: worker-1
      WORKER_POLL_SECONDS: 2
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-240}
      LOCAL_THINKING: ${LOCAL_THINKING:-false}
      LOCAL_MAX_OUTPUT_TOKENS: ${LOCAL_MAX_OUTPUT_TOKENS:-768}
      MODEL_TRANSIENT_RETRIES: ${MODEL_TRANSIENT_RETRIES:-2}
      STRUCTURED_OUTPUT_RETRIES: ${STRUCTURED_OUTPUT_RETRIES:-1}
      AGENT_MAX_TURNS: ${AGENT_MAX_TURNS:-8}
      APPROVAL_SIGNING_SECRET: ${APPROVAL_SIGNING_SECRET:-}
      APPROVAL_LINK_TTL_HOURS: ${APPROVAL_LINK_TTL_HOURS:-72}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-true}
      SHOPIFY_CLIENT_ID: ${SHOPIFY_CLIENT_ID:-}
      SHOPIFY_CLIENT_SECRET: ${SHOPIFY_CLIENT_SECRET:-}
      BROWSER_RUNTIME_URL: http://browser-runtime:8430
      COMPUTER_USE_MODEL: ${COMPUTER_USE_MODEL:-gpt-5.6}
      COMPUTER_USE_MAX_STEPS: ${COMPUTER_USE_MAX_STEPS:-12}
    volumes:
      - company_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - browser-runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped

volumes:
  company_data:
  browser_data:
